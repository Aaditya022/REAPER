zerops:
  - setup: web
    build:
      base: nodejs@22
      buildCommands:
        - cd web && npm install
        - cd web && npm run build
      deployFiles:
        - web/.next
        - web/package.json
        - web/public
        - web/node_modules
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      start: cd web && npm start -- -H 0.0.0.0
