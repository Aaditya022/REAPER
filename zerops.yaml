zerops:
  - setup: web
    build:
      base: nodejs@22
      buildCommands:
        - cd web && npm install
        - cd web && npm run build
      deployFiles:
        - ./web/~/
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      start: npm start -- -p 3000 -H 0.0.0.0
