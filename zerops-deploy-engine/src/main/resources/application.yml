server:
  port: ${IGNITION_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: stackd-ignition
  lifecycle:
    timeout-per-shutdown-phase: 20s
  config:
    import:
      - optional:file:.env[.properties]
      - optional:classpath:application-secrets.yml
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service: stackd-ignition
  level:
    root: INFO
    com.stackd.ignition: DEBUG
    org.springframework.boot.context.config: WARN

ignition:
  zerops:
    api-base-url: ${ZEROPS_API_BASE_URL:https://api.app-prg1.zerops.io/api/rest/public}
    api-token: ${ZEROPS_API_TOKEN:}
    api-timeout-ms: ${ZEROPS_API_TIMEOUT_MS:30000}
  deploy:
    poll-interval-ms: ${IGNITION_POLL_INTERVAL_MS:5000}
    max-poll-interval-ms: ${IGNITION_MAX_POLL_INTERVAL_MS:60000}
    poll-timeout-ms: ${IGNITION_POLL_TIMEOUT_MS:300000}
    health-check-timeout-ms: ${IGNITION_HEALTH_TIMEOUT_MS:30000}
    executor-pool-size: ${IGNITION_DEPLOY_EXECUTOR_POOL_SIZE:4}
